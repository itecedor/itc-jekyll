---
layout: default
---

<ul class="post-list">
{% for post in site.posts %}
    <a class="post-link" href="{{ post.url | prepend: site.baseurl }}">
      <img src="{{ site.baseurl }}/assets/image/{{post.image}}" class="blog-thumb">
      {{ post.title }}
    </a>
    <span class="post-meta">{{ post.date | date: "%b %-d, %Y" }}</span>
{% endfor %}
</ul>
